name: Build Relay Desktop (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'desktop/**'
      - 'lib/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: relay-desktop-windows-x64
          path: desktop/dist/Relay-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30
